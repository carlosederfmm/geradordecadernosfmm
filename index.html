<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SME FMM - Manutenção</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .maintenance-card {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #d32f2f;
        }
        .logo {
            max-width: 250px;
            margin-bottom: 30px;
        }
        h1 {
            color: #003c5b;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #475569;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-acesso {
            display: inline-block;
            background-color: #00638f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-acesso:hover {
            background-color: #003c5b;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <img src="https://www.fundacaomatiasmachline.org.br/wp-content/uploads/2024/04/FMM-1-Fundo-Claro.png" alt="Logo FMM" class="logo">
        <h1>SISTEMA EM MANUTENÇÃO</h1>
        <p>O ambiente principal do SME está temporariamente indisponível para atualizações de infraestrutura e melhorias.</p>
        <a href="gerador.html" class="btn-acesso">Acessar Gerador de Provas (Rota Alternativa)</a>
    </div>

</body>
</html>
