<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cadernos - SME FMM</title>
    <style>
        :root {
            --cor-primaria: #003c5b;
            --cor-secundaria: #00638f;
            --cor-acao: #80a51b;
            --cor-fundo: #f4f6f9;
            --cor-card: #ffffff;
            --cor-erro: #d32f2f;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--cor-fundo);
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            background-color: var(--cor-card);
            max-width: 1000px; /* Aumentado para acomodar 3 botões */
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .logo { width: 280px; margin-bottom: 20px; }
        
        .titulo {
            color: var(--cor-primaria);
            font-size: 24px;
            font-weight: bold;
        }

        .btn-voltar {
            position: absolute;
            left: 0;
            top: 50px;
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .btn-voltar:hover { background-color: #cbd5e1; }

        .tela { display: none; animation: fadeIn 0.4s ease; }
        .tela.ativa { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-opcao {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-opcao:hover { background-color: var(--cor-secundaria); }

        .btn-opcao.secundario { background-color: var(--cor-secundaria); }
        .btn-opcao.secundario:hover { background-color: var(--cor-primaria); }

        .lista-disciplinas {
            background-color: var(--cor-fundo);
            border-radius: 12px;
            padding: 20px;
            max-height: 50vh;
            overflow-y: auto;
            margin-bottom: 30px;
        }

        .linha-disciplina {
            background-color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
            gap: 15px;
        }

        .nome-disciplina {
            font-weight: bold;
            color: var(--cor-primaria);
            width: 180px;
        }

        .acoes-upload {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .btn-upload {
            background-color: var(--cor-secundaria);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            border: none;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .btn-upload input[type="file"] {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .status-badge {
            font-size: 12px;
            font-style: italic;
            width: 140px;
            text-align: right;
        }
        .status-pendente { color: #94a3b8; }
        .status-parcial { color: #f59e0b; }
        .status-pronto { color: var(--cor-acao); font-weight: bold; }

        .btn-gerar {
            background-color: var(--cor-acao);
            color: white;
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #avisoProcessamento {
            text-align: center;
            margin-top: 15px;
            color: var(--cor-secundaria);
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button class="btn-voltar" id="btnVoltar" onclick="voltarTela()">← Voltar</button>
            <img src="https://www.fundacaomatiasmachline.org.br/wp-content/uploads/2024/04/FMM-1-Fundo-Claro.png" alt="SME FMM" class="logo">
            <h2 class="titulo" id="tituloTela">Selecione o Nível de Ensino</h2>
        </div>

        <div id="telaNivel" class="tela ativa">
            <button class="btn-opcao" onclick="selecionarNivel('Ensino Fundamental')">Ensino Fundamental</button>
            <button class="btn-opcao" onclick="selecionarNivel('Ensino Médio')">Ensino Médio</button>
            <button class="btn-opcao" onclick="selecionarNivel('Ensino Técnico')">Ensino Técnico</button>
        </div>

        <div id="telaSerie" class="tela">
            <div id="listaSeries"></div>
        </div>

        <div id="telaUpload" class="tela">
            <div class="lista-disciplinas" id="listaDisciplinas"></div>
            <button class="btn-gerar" id="btnGerar" onclick="processarCadernos()">GERAR E BAIXAR CADERNOS (.ZIP)</button>
            <div id="avisoProcessamento">⏳ Mesclando PDF (Capa + Rascunho + Prova)... Aguarde.</div>
        </div>

        <div id="telaSucesso" class="tela" style="text-align: center;">
            <h2 style="color: var(--cor-acao); margin-bottom: 20px;">✨ Sucesso!</h2>
            <p style="margin-bottom: 30px;">Download do arquivo <strong>.zip</strong> iniciado.</p>
            <button class="btn-opcao" onclick="location.reload()">Novo Lote</button>
        </div>
    </div>

    <script type="module">
        import { PDFDocument } from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';
        import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

        const ESTRUTURA_ENSINO = {
            "Ensino Fundamental": {
                "series": ["5º ano", "6º ano", "7º ano", "8º ano", "9º ano"],
                "disciplinas": ["Arte", "Ciências", "Filosofia", "Geografia", "História", "Inglês", "Língua Portuguesa", "Matemática"]
            },
            "Ensino Médio": {
                "series": ["1ª Série", "2ª Série", "3ª Série"],
                "disciplinas": ["Arte", "Biologia", "Filosofia", "Física", "Geografia", "Geometria", "História", "Inglês", "Interpretação Textual", "Literatura", "Língua Portuguesa", "Química", "Sociologia", "Álgebra"]
            },
            "Ensino Técnico": {
                "1ª Série": ["Arquitetura e Manutenção de Computadores", "Circuitos Elétricos e Instrumentação", "Programação de Computadores", "Tecnologia de Materiais"],
                "2ª Série": ["Automação Industrial I", "Desenvolvimento Web I", "Infraestrutura e Laboratório de Redes", "Laboratório de Banco de Dados", "Programação de Microncontroladores"],
                "3ª Série Informática": ["Desenvolvimento de Jogos", "Desenvolvimento Mobile II", "Desenvolvimento de Sistemas Embarcados II"],
                "3ª Série Mecatrônica": ["Automação Industrial II", "Desenvolvimento de Sistemas Embarcados II", "Sistemas Pneumáticos e Hidráulicos"]
            }
        };

        let nivelAtual = null;
        let serieAtual = null;
        let arquivosMemoria = {}; 

        window.selecionarNivel = function(nivel) {
            nivelAtual = nivel;
            document.getElementById('tituloTela').innerText = nivel;
            document.getElementById('btnVoltar').style.display = 'block';
            const opcoes = nivel === "Ensino Técnico" ? Object.keys(ESTRUTURA_ENSINO[nivel]) : ESTRUTURA_ENSINO[nivel].series;
            const lista = document.getElementById('listaSeries');
            lista.innerHTML = '';
            opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao secundario';
                btn.innerText = opcao;
                btn.onclick = () => selecionarSerie(opcao);
                lista.appendChild(btn);
            });
            mudarTela('telaSerie');
        }

        window.selecionarSerie = function(serie) {
            serieAtual = serie;
            document.getElementById('tituloTela').innerText = `Cadernos: ${serie}`;
            const disciplinas = nivelAtual === "Ensino Técnico" ? ESTRUTURA_ENSINO[nivelAtual][serie] : ESTRUTURA_ENSINO[nivelAtual].disciplinas;
            const lista = document.getElementById('listaDisciplinas');
            lista.innerHTML = '';
            arquivosMemoria = {};

            disciplinas.forEach(disc => {
                arquivosMemoria[disc] = { capa: null, rascunho: null, prova: null };
                const div = document.createElement('div');
                div.className = 'linha-disciplina';
                div.innerHTML = `
                    <div class="nome-disciplina">${disc}</div>
                    <div class="acoes-upload">
                        <button class="btn-upload">Capa <input type="file" accept=".pdf" onchange="registrarArquivo('${disc}', 'capa', this)"></button>
                        <button class="btn-upload">Rascunho <input type="file" accept=".pdf" onchange="registrarArquivo('${disc}', 'rascunho', this)"></button>
                        <button class="btn-upload">Prova <input type="file" accept=".pdf" onchange="registrarArquivo('${disc}', 'prova', this)"></button>
                    </div>
                    <div class="status-badge status-pendente" id="status-${disc.replace(/\s+/g, '')}">Pendente (0/3)</div>
                `;
                lista.appendChild(div);
            });
            mudarTela('telaUpload');
        }

        window.registrarArquivo = function(disc, tipo, inputElement) {
            if (inputElement.files.length > 0) {
                arquivosMemoria[disc][tipo] = inputElement.files[0];
                atualizarStatusUI(disc);
            }
        }

        function atualizarStatusUI(disc) {
            const status = arquivosMemoria[disc];
            const idBadge = `status-${disc.replace(/\s+/g, '')}`;
            const badge = document.getElementById(idBadge);
            const count = [status.capa, status.rascunho, status.prova].filter(x => x !== null).length;

            if (count === 3) {
                badge.className = 'status-badge status-pronto';
                badge.innerText = '✅ Pronto (3/3)';
            } else {
                badge.className = 'status-badge status-parcial';
                badge.innerText = `Subindo... (${count}/3)`;
            }
        }

        window.voltarTela = function() {
            const telaAtiva = document.querySelector('.tela.ativa').id;
            if (telaAtiva === 'telaSerie') { mudarTela('telaNivel'); document.getElementById('btnVoltar').style.display = 'none'; }
            else if (telaAtiva === 'telaUpload') { selecionarNivel(nivelAtual); }
        }

        window.mudarTela = function(idAlvo) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById(idAlvo).classList.add('ativa');
        }

        window.processarCadernos = async function() {
            const disciplinasValidas = Object.keys(arquivosMemoria).filter(d => 
                arquivosMemoria[d].capa && arquivosMemoria[d].rascunho && arquivosMemoria[d].prova
            );
            
            if (disciplinasValidas.length === 0) {
                alert("Preencha os 3 PDFs (Capa + Rascunho + Prova) de ao menos uma disciplina.");
                return;
            }

            document.getElementById('btnGerar').disabled = true;
            document.getElementById('avisoProcessamento').style.display = 'block';

            try {
                const zip = new JSZip();
                const pastaPrincipal = zip.folder(`CADERNOS_FMM_${serieAtual.replace(/ /g, '_')}`);

                for (const disc of disciplinasValidas) {
                    const arquivos = arquivosMemoria[disc];
                    
                    const coverBuffer = await arquivos.capa.arrayBuffer();
                    const rascunhoBuffer = await arquivos.rascunho.arrayBuffer();
                    const provaBuffer = await arquivos.prova.arrayBuffer();

                    const coverDoc = await PDFDocument.load(coverBuffer);
                    const rascunhoDoc = await PDFDocument.load(rascunhoBuffer);
                    const provaDoc = await PDFDocument.load(provaBuffer);
                    
                    const mergedPdf = await PDFDocument.create();
                    
                    // Ordem: Capa -> Rascunho -> Prova
                    const docs = [coverDoc, rascunhoDoc, provaDoc];
                    for (const doc of docs) {
                        const pages = await mergedPdf.copyPages(doc, doc.getPageIndices());
                        pages.forEach(page => mergedPdf.addPage(page));
                    }

                    const mergedBytes = await mergedPdf.save();
                    pastaPrincipal.file(`CADERNO_${disc}.pdf`, mergedBytes);
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const url = window.URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `SME_FMM_${serieAtual.replace(/ /g, '_')}.zip`;
                a.click();
                mudarTela('telaSucesso');

            } catch (error) {
                alert("Erro ao processar: " + error.message);
            } finally {
                document.getElementById('btnGerar').disabled = false;
                document.getElementById('avisoProcessamento').style.display = 'none';
            }
        }
    </script>
</body>
</html>
