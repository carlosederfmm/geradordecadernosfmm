<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cadernos - SME FMM</title>
    <style>
        :root {
            --cor-primaria: #003c5b;
            --cor-secundaria: #00638f;
            --cor-acao: #80a51b;
            --cor-fundo: #f4f6f9;
            --cor-card: #ffffff;
            --cor-erro: #d32f2f;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--cor-fundo);
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            background-color: var(--cor-card);
            max-width: 900px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .logo { width: 280px; margin-bottom: 20px; }
        
        .titulo {
            color: var(--cor-primaria);
            font-size: 24px;
            font-weight: bold;
        }

        .btn-voltar {
            position: absolute;
            left: 0;
            top: 50px;
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .btn-voltar:hover { background-color: #cbd5e1; }

        .tela { display: none; animation: fadeIn 0.4s ease; }
        .tela.ativa { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-opcao {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-opcao:hover { background-color: var(--cor-secundaria); }

        .btn-opcao.secundario { background-color: var(--cor-secundaria); }
        .btn-opcao.secundario:hover { background-color: var(--cor-primaria); }

        .lista-disciplinas {
            background-color: var(--cor-fundo);
            border-radius: 12px;
            padding: 20px;
            max-height: 50vh;
            overflow-y: auto;
            margin-bottom: 30px;
        }

        .linha-disciplina {
            background-color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nome-disciplina {
            font-weight: bold;
            color: var(--cor-primaria);
            flex: 1;
            min-width: 200px;
        }

        .acoes-upload {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-upload {
            background-color: var(--cor-secundaria);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn-upload input[type="file"] {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .status-badge {
            font-size: 13px;
            font-style: italic;
            width: 120px;
            text-align: right;
        }
        .status-pendente { color: #94a3b8; }
        .status-parcial { color: #f59e0b; }
        .status-pronto { color: var(--cor-primaria); font-weight: bold; }

        .btn-gerar {
            background-color: var(--cor-acao);
            color: white;
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-gerar:hover { background-color: #6d8c16; }
        .btn-gerar:disabled { background-color: #ccc; cursor: not-allowed; }

        #avisoProcessamento {
            text-align: center;
            margin-top: 15px;
            color: var(--cor-secundaria);
            font-weight: bold;
            display: none;
        }

        /* Responsividade Mobile */
        @media (max-width: 600px) {
            .linha-disciplina { flex-direction: column; align-items: flex-start; }
            .acoes-upload { width: 100%; justify-content: space-between; }
            .status-badge { text-align: left; margin-top: 5px; }
            .btn-voltar { top: 10px; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button class="btn-voltar" id="btnVoltar" onclick="voltarTela()">← Voltar</button>
            <img src="https://www.fundacaomatiasmachline.org.br/wp-content/uploads/2024/04/FMM-1-Fundo-Claro.png" alt="SME FMM" class="logo">
            <h2 class="titulo" id="tituloTela">Selecione o Nível de Ensino</h2>
        </div>

        <div id="telaNivel" class="tela ativa">
            <button class="btn-opcao" onclick="selecionarNivel('Ensino Fundamental')">Ensino Fundamental</button>
            <button class="btn-opcao" onclick="selecionarNivel('Ensino Médio')">Ensino Médio</button>
            <button class="btn-opcao" onclick="selecionarNivel('Ensino Técnico')">Ensino Técnico</button>
        </div>

        <div id="telaSerie" class="tela">
            <div id="listaSeries"></div>
        </div>

        <div id="telaUpload" class="tela">
            <div class="lista-disciplinas" id="listaDisciplinas"></div>
            <button class="btn-gerar" id="btnGerar" onclick="processarCadernos()">GERAR E BAIXAR CADERNOS (.ZIP)</button>
            <div id="avisoProcessamento">⏳ Processando PDFs... Por favor, aguarde.</div>
        </div>

        <div id="telaSucesso" class="tela" style="text-align: center;">
            <h2 style="color: var(--cor-acao); margin-bottom: 20px; font-size: 28px;">✨ Sucesso!</h2>
            <p style="font-size: 16px; margin-bottom: 30px; color: #475569;">
                Seus cadernos foram gerados e o download do arquivo <strong>.zip</strong> foi iniciado automaticamente.
            </p>
            <button class="btn-opcao" onclick="location.reload()">Fazer novos cadernos</button>
        </div>

    </div>

    <script type="module">
        import { PDFDocument } from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';
        import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

        // --- DADOS DO SISTEMA ---
        const ESTRUTURA_ENSINO = {
            "Ensino Fundamental": {
                "series": ["5º ano", "6º ano", "7º ano", "8º ano", "9º ano"],
                "disciplinas": ["Arte", "Ciências", "Filosofia", "Geografia", "História", "Inglês", "Língua Portuguesa", "Matemática"]
            },
            "Ensino Médio": {
                "series": ["1ª Série", "2ª Série", "3ª Série"],
                "disciplinas": ["Arte", "Biologia", "Filosofia", "Física", "Geografia", "Geometria", "História", "Inglês", "Interpretação Textual", "Literatura", "Língua Portuguesa", "Química", "Sociologia", "Álgebra"]
            },
            "Ensino Técnico": {
                "1ª Série": ["Arquitetura e Manutenção de Computadores", "Circuitos Elétricos e Instrumentação", "Programação de Computadores", "Tecnologia de Materiais"],
                "2ª Série": ["Automação Industrial I", "Desenvolvimento Web I", "Infraestrutura e Laboratório de Redes", "Laboratório de Banco de Dados", "Programação de Microncontroladores"],
                "3ª Série Informática": ["Desenvolvimento de Jogos", "Desenvolvimento Mobile II", "Desenvolvimento de Sistemas Embarcados II"],
                "3ª Série Mecatrônica": ["Automação Industrial II", "Desenvolvimento de Sistemas Embarcados II", "Sistemas Pneumáticos e Hidráulicos"]
            }
        };

        // --- VARIÁVEIS DE ESTADO ---
        let nivelAtual = null;
        let serieAtual = null;
        let arquivosMemoria = {}; // { "Matemática": { capa: File, prova: File } }

        // --- NAVEGAÇÃO E UI ---
        window.selecionarNivel = function(nivel) {
            nivelAtual = nivel;
            document.getElementById('tituloTela').innerText = nivel;
            document.getElementById('btnVoltar').style.display = 'block';
            
            const opcoes = nivel === "Ensino Técnico" ? Object.keys(ESTRUTURA_ENSINO[nivel]) : ESTRUTURA_ENSINO[nivel].series;
            
            const lista = document.getElementById('listaSeries');
            lista.innerHTML = '';
            opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao secundario';
                btn.innerText = opcao;
                btn.onclick = () => selecionarSerie(opcao);
                lista.appendChild(btn);
            });

            mudarTela('telaSerie');
        }

        window.selecionarSerie = function(serie) {
            serieAtual = serie;
            document.getElementById('tituloTela').innerText = `Cadernos: ${serie}`;
            arquivosMemoria = {};

            const disciplinas = nivelAtual === "Ensino Técnico" 
                ? ESTRUTURA_ENSINO[nivelAtual][serie] 
                : ESTRUTURA_ENSINO[nivelAtual].disciplinas;

            const lista = document.getElementById('listaDisciplinas');
            lista.innerHTML = '';

            disciplinas.forEach(disc => {
                arquivosMemoria[disc] = { capa: null, prova: null };
                
                // HTML da linha da disciplina
                const div = document.createElement('div');
                div.className = 'linha-disciplina';
                div.innerHTML = `
                    <div class="nome-disciplina">${disc}</div>
                    <div class="acoes-upload">
                        <button class="btn-upload">Capa <input type="file" accept=".pdf" onchange="registrarArquivo('${disc}', 'capa', this)"></button>
                        <button class="btn-upload">Prova <input type="file" accept=".pdf" onchange="registrarArquivo('${disc}', 'prova', this)"></button>
                        <div class="status-badge status-pendente" id="status-${disc.replace(/\s+/g, '')}">Pendente</div>
                    </div>
                `;
                lista.appendChild(div);
            });

            mudarTela('telaUpload');
        }

        window.voltarTela = function() {
            const telaAtiva = document.querySelector('.tela.ativa').id;
            if (telaAtiva === 'telaSerie') {
                mudarTela('telaNivel');
                document.getElementById('tituloTela').innerText = 'Selecione o Nível de Ensino';
                document.getElementById('btnVoltar').style.display = 'none';
            } else if (telaAtiva === 'telaUpload') {
                selecionarNivel(nivelAtual); // Repopula e volta pra seleção de série
            }
        }

        window.mudarTela = function(idAlvo) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById(idAlvo).classList.add('ativa');
        }

        // --- LÓGICA DE UPLOAD ---
        window.registrarArquivo = function(disc, tipo, inputElement) {
            if (inputElement.files.length > 0) {
                arquivosMemoria[disc][tipo] = inputElement.files[0];
                atualizarStatusUI(disc);
            }
        }

        function atualizarStatusUI(disc) {
            const status = arquivosMemoria[disc];
            const idBadge = `status-${disc.replace(/\s+/g, '')}`;
            const badge = document.getElementById(idBadge);

            if (status.capa && status.prova) {
                badge.className = 'status-badge status-pronto';
                badge.innerText = 'Pronto p/ Gerar';
            } else if (status.capa || status.prova) {
                badge.className = 'status-badge status-parcial';
                badge.innerText = status.capa ? 'Capa OK' : 'Prova OK';
            }
        }

        // --- MOTOR DE PROCESSAMENTO DE PDF (.zip) ---
        window.processarCadernos = async function() {
            const disciplinasValidas = Object.keys(arquivosMemoria).filter(d => arquivosMemoria[d].capa && arquivosMemoria[d].prova);
            
            if (disciplinasValidas.length === 0) {
                alert("Nenhum caderno completo (Capa + Prova) foi selecionado.");
                return;
            }

            document.getElementById('btnGerar').disabled = true;
            document.getElementById('avisoProcessamento').style.display = 'block';

            try {
                const zip = new JSZip();
                const pastaPrincipal = zip.folder(`CADERNOS_${serieAtual.replace(/ /g, '_')}`);

                for (const disc of disciplinasValidas) {
                    const arquivos = arquivosMemoria[disc];
                    
                    // Lendo os arquivos como ArrayBuffer
                    const coverBuffer = await arquivos.capa.arrayBuffer();
                    const provaBuffer = await arquivos.prova.arrayBuffer();

                    // Carregando com pdf-lib
                    const coverDoc = await PDFDocument.load(coverBuffer);
                    const provaDoc = await PDFDocument.load(provaBuffer);
                    
                    // Criando o PDF final
                    const mergedPdf = await PDFDocument.create();
                    
                    // Copiando as páginas
                    const coverPages = await mergedPdf.copyPages(coverDoc, coverDoc.getPageIndices());
                    coverPages.forEach(page => mergedPdf.addPage(page));
                    
                    const provaPages = await mergedPdf.copyPages(provaDoc, provaDoc.getPageIndices());
                    provaPages.forEach(page => mergedPdf.addPage(page));

                    // Salvando os bytes e adicionando ao ZIP
                    const mergedBytes = await mergedPdf.save();
                    pastaPrincipal.file(`CADERNO_${disc}.pdf`, mergedBytes);
                }

                // Gera o ZIP e força o download
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const url = window.URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `SME_FMM_${serieAtual.replace(/ /g, '_')}.zip`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);

                document.getElementById('tituloTela').innerText = '';
                document.getElementById('btnVoltar').style.display = 'none';
                mudarTela('telaSucesso');

            } catch (error) {
                console.error(error);
                alert("Ocorreu um erro ao processar os PDFs. Verifique se os arquivos não estão corrompidos ou protegidos por senha.");
            } finally {
                document.getElementById('btnGerar').disabled = false;
                document.getElementById('avisoProcessamento').style.display = 'none';
            }
        }
    </script>
</body>
</html>
